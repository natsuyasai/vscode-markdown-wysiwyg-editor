name: CI

on:
  # マージ前の pull_request で検証するため、マージ後の push では二重実行しない
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webview-ui/*lock.json
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run build
      # Storybook の play function は vitest ブラウザモード(chromium)で実行するため
      # Playwright のブラウザを先に用意する。
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # package.json の lint / test スクリプトは `&` 連結で Linux では失敗が伝播しないため、直接実行する
      - run: npm run check-types
      - run: npx eslint src
      - run: npm run compile-tests
      - run: node esbuild.js
      - name: VS Code extension tests
        run: xvfb-run -a npx vscode-test

  package:
    runs-on: ubuntu-latest
    needs: [webview-ui, extension]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webview-ui
      - run: npm run build:webview
      - name: Package VSIX
        run: npx vsce package
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-wysiwyg-editor-${{ steps.version.outputs.version }}.vsix
          path: ./markdown-wysiwyg-editor-${{ steps.version.outputs.version }}.vsix
          retention-days: 7
          if-no-files-found: error
