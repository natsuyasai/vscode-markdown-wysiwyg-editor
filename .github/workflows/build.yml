name: PR Build, Lint, and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install root dependencies
        run: npm ci

      - name: Install webview-ui dependencies
        run: |
          cd webview-ui
          npm ci

  build:
    name: build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build webview-ui
        run: |
          cd webview-ui
          npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build webview-ui
        run: |
          cd webview-ui
          npm run build

      - name: Lint root
        run: npm run lint

      - name: Lint webview-ui
        run: |
          cd webview-ui
          npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install playwright
        run: |
          cd webview-ui
          npx playwright install --with-deps chromium

      # unit / storybook / gherkin / gherkin-browser をすべて実行する
      - name: Run tests (webview-ui)
        run: |
          cd webview-ui
          npm run test

      - name: Build extension tests
        run: npm run compile-tests && node esbuild.js

      # webview-uiのテストは上で実行済みのため、拡張機能のテスト（mocha + cucumber）のみ実行する
      - name: VSCode extension tests
        run: xvfb-run -a npm run test:extension
